# In Falsus 復盤系統設定檔
project:
  name: "InFalsus-Replay-System"
  version: "1.1.0"

# 模型設定 (三分類架構: early / perfect / late)
model:
  name: "yolov11s"
  weights_path: "models/yolov11s_infalsus_ultimate.pt"
  conf_threshold: 0.30
  iou_threshold: 0.45
  device: "cuda" # 若無 GPU 可設為 "cpu"
  input_size: 960
  augment: false # 是否啟用 TTA 測試時增強

# 模型預測類別 (對齊實際視覺標籤)
classes:
  0: "exact"   # 大P (完美擊打, -25ms ~ +25ms)
  1: "near"    # 偏誤擊打 (偏快/偏慢, ±25ms ~ ±50ms)
  2: "break"   # 斷連失誤 (> 50ms)

# In Falsus 官方大P判定指標 (毫秒 ms)
timing_metrics:
  perfect_window_ms: 25.0 # ±25ms 內為大P
  display_min_ms: -70.0   # 圖表縱軸下限
  display_max_ms: 70.0    # 圖表縱軸上限

# 感興趣區域 (ROI) 設定 (以 1920x1080 為基準之相對比例 0.0 ~ 1.0)
roi:
  crop:
    ymin: 0.55
    ymax: 0.98
    xmin: 0.05
    xmax: 0.95
  
  # 6 軌按鍵槽位水平相對區間 (在 ROI 寬度內的劃分)
  lanes:
    lane_1: [0.00, 0.16] # Shift
    lane_2: [0.16, 0.32] # Key A
    lane_3: [0.32, 0.48] # Key S
    lane_4: [0.48, 0.64] # Key D
    lane_5: [0.64, 0.80] # Key F
    lane_6: [0.80, 1.00] # Space
  
  # 空中滑軌判定縱向相對範圍 (在 ROI 高度內的劃分)
  slide_lane:
    ymin: 0.00
    ymax: 0.55

# 時序狀態追蹤參數 (空間 IoU 與類別動畫生命週期追蹤)
tracker:
  fps_default: 60
  dist_match_px: 45.0
  max_gap_frames: 2
  conf_thresholds:
    exact: 0.42
    near: 0.42
    break: 0.32
  class_lifetimes:
    exact: 16
    near: 30
    break: 35

# 輸出設定
output:
  report_dir: "reports"
  export_charts: true
  export_html: true
  export_json: true
